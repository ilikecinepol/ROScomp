[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolf-go2-autonomy"
version = "0.1.0"
description = "Бортовой контроллер и офлайн-проверки Go2"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "opencv-python-headless>=4.9,<6"]

[project.scripts]
wolf-go2 = "wolf_go2.__main__:main"

[tool.setuptools.packages.find]
include = ["wolf_go2*"]
